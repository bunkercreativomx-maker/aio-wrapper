name: Release

# Builds the Windows installer and the Linux AppImage and publishes them to a GitHub Release
# whenever a version tag like v1.0.9 is pushed. electron-updater then auto-updates installed
# apps. Tag name MUST equal the version in package.json (with leading "v").
#
# IMPORTANT: electron-builder only uploads assets to a release that is still a DRAFT, and it
# refuses to touch an existing PUBLISHED release with the same tag. So neither build job may
# publish. Each job uploads its platform's assets to the same draft, then a final `publish`
# job (which waits for both) flips the draft to published exactly once.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (must already be in package.json), e.g. 1.0.9'
        required: true

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches package.json version
        id: v
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
          else
            TAG_VER="${{ github.event.inputs.version }}"
          fi
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "::error:: package.json version ($PKG_VER) does not match tag ($TAG_VER)"
            exit 1
          fi
          echo "version=$PKG_VER"
          echo "Releasing v$PKG_VER"

  build-windows:
    needs: verify-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Windows installer (uploads to draft release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish always

  build-linux:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # libfuse2 is needed by electron-builder to run/mount AppImages on Ubuntu 24 runners.
      - name: Install AppImage tooling
        run: sudo apt-get update && sudo apt-get install -y libfuse2
      - name: Build Linux AppImage (uploads to draft release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux AppImage --publish always

  # Waits for both platform builds, then publishes the draft release exactly once so
  # downloads resolve to /download/<tag>/ (required for electron-updater).
  publish:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      # gh needs a git repo to resolve the tag, so check out first.
      - uses: actions/checkout@v4
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.version }}}"
          gh release edit "$TAG" --draft=false
          echo "Published $TAG"
          gh release view "$TAG" --json tagName,isDraft,assets --jq '{tag: .tagName, draft: .isDraft, assets: [.assets[].name]}'
