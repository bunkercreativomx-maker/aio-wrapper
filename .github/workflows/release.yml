name: Release

# Builds the Windows installer and the Linux AppImage and publishes them to ONE GitHub Release
# whenever a version tag like v1.3.0 is pushed. Tag name MUST equal package.json version (with "v").
#
# Why the build jobs never publish themselves: electron-builder's GitHub publisher creates/updates
# a release per file-upload, and with two platform jobs that races into duplicate release records
# for the same tag (we hit exactly that: one draft with the good assets, one published with just a
# blockmap). Instead each job builds with --publish never and uploads plain artifacts; a single
# final job creates the one release from those artifacts. Deterministic, no races.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (must already be in package.json), e.g. 1.3.0'
        required: true

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches package.json version
        id: v
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
          else
            TAG_VER="${{ github.event.inputs.version }}"
          fi
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "::error:: package.json version ($PKG_VER) does not match tag ($TAG_VER)"
            exit 1
          fi
          echo "version=$PKG_VER"
          echo "Releasing v$PKG_VER"

  build-windows:
    needs: verify-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build Windows installer (no publish)
        run: npm run dist -- --publish never
      - name: Collect Windows artifacts
        shell: bash
        run: |
          mkdir -p out
          cp dist/*.exe dist/*.blockmap dist/latest.yml out/ 2>/dev/null || true
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: win
          path: out/*
          if-no-files-found: error

  build-linux:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # libfuse2 is needed by electron-builder to run/mount AppImages on Ubuntu 24 runners.
      - run: sudo apt-get update && sudo apt-get install -y libfuse2
      - name: Build Linux AppImage (no publish)
        run: npx electron-builder --linux AppImage --publish never
      - name: Collect Linux artifacts
        run: |
          mkdir -p out
          cp dist/*.AppImage dist/latest-linux.yml out/ 2>/dev/null || true
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*
          if-no-files-found: error

  # Single source of truth for the release: one job, one release, all platform assets.
  publish:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Show collected assets
        run: ls -la assets
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME:-v${{ github.event.inputs.version }}}"
          echo "Publishing $TAG"
          # Fresh release: create it with all assets. If it somehow exists, replace its assets.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; uploading/replacing assets"
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* \
              --title "$TAG" \
              --notes "WrapperOne $TAG — Windows (.exe) and Linux/Omarchy (.AppImage)."
          fi
          echo "--- final state ---"
          gh release view "$TAG" --json tagName,isDraft,assets --jq '{tag: .tagName, draft: .isDraft, assets: [.assets[].name]}'
