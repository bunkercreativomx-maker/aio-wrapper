name: Release

# Builds the Windows installer and publishes it (exe + latest.yml) to a GitHub Release
# whenever a version tag like v1.0.4 is pushed. electron-updater then auto-updates
# installed apps. Tag name MUST equal the version in package.json (with leading "v").

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (must already be in package.json), e.g. 1.0.4'
        required: true

# Allow the workflow to create/update GitHub Releases (electron-builder publish step)
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
          else
            TAG_VER="${{ github.event.inputs.version }}"
          fi
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "::error:: package.json version ($PKG_VER) does not match tag ($TAG_VER)"
            exit 1
          fi
          echo "Releasing v$PKG_VER"

      - name: Install dependencies
        run: npm ci

      - name: Build installer and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish always

      # electron-builder can leave the release as a draft (assets under an "untagged" URL),
      # which breaks electron-updater. Publish it so downloads resolve to /download/<tag>/.
      - name: Ensure release is published (not draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.version }}}"
          gh release edit "$TAG" --draft=false || echo "no draft release to publish"
